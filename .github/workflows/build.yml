name: Build, test and deploy the observatory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refetch:
        description: "Re-download all official sources and rebuild from raw"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 1 * *"   # monthly: check whether official sources changed upstream

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Rebuilds every number from the official sources. Fails if a source changed upstream
  # (checksum differs from data/raw/MANIFEST.csv): review, then run locally with --accept-updates.
  rebuild-from-sources:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refetch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m src.run_pipeline --fetch
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/

  # Builds the site from the committed, validated public layer and deploys it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Validate, build site, production audit
        run: python -m src.run_pipeline --from-processed
      - name: Tests
        run: pytest -q
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
