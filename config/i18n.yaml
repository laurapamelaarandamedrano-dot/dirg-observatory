  story:
    - k: "question"
      h: "La pregunta"
      p: "La infraestructura digital en México se expande. Entre 2019 y 2025 el número de regiones de nube a hiperescala reportadas en el país pasó de {regions_2019} a {regions_2025}. El observatorio pregunta cómo se relaciona esa expansión con los sistemas energéticos, la presión hídrica y la forma en que se gobiernan los recursos, sin dar por sentada la respuesta."
    - k: "territory"
      h: "El territorio"
      p: "La infraestructura es territorial. Cada región documentada está en uno de {region_states} estados, y {top_share} de ellas en {top_state}. La gráfica cuenta las regiones reportadas en operación al cierre de cada año. Los proyectos anunciados se registran aparte y nunca se cuentan como construidos."
    - k: "resources"
      h: "Los recursos"
      p: "Los centros de datos dependen de los sistemas eléctricos y, según su enfriamiento, del agua. Abajo se muestran dos de las series que usa el observatorio: el consumo final nacional de electricidad (CFE) y la intensidad promedio de la sequía de los 32 estados (SMN). El consumo solo se publica abiertamente a nivel nacional, así que no puede mapearse por estado."
    - k: "governance"
      h: "La gobernanza"
      p: "El agua y la energía se asignan mediante instituciones: concesiones, permisos, ordenamientos de aguas subterráneas y leyes de planeación. México reescribió sus leyes eléctricas en marzo de 2025 y sus leyes de aguas en diciembre de 2025. En {ord_year}, cada estado tenía al menos {min_ord}% de su superficie bajo algún ordenamiento de aguas subterráneas de CONAGUA (veda, reglamento o acuerdo de suspensión). El observatorio mapea estos instrumentos de forma descriptiva. No califica legalidad, y las preguntas jurídicas abiertas se conservan como preguntas."
    - k: "data"
      h: "Los datos"
      p: "Cada valor lleva su estatus epistémico. De los {n_index} indicadores que alimentan el índice, {n_direct} son registrados directamente por una fuente oficial o documental; el resto son derivados, estimados o modelados. El uso de agua y energía por instalación de los centros de datos no se reporta públicamente en México, por eso no está en el conjunto de datos."
    - k: "model"
      h: "El modelo"
      p: "El Índice de Tensión Sociotécnica de Recursos promedia cuatro pilares (agua, energía, infraestructura digital, vulnerabilidad territorial) en escalas agrupadas de 0 a 100. Los pesos iguales son una línea base transparente, no un hallazgo. Ocho especificaciones alternativas y 2,000 ponderaciones aleatorias prueban cuánto depende la clasificación de esa elección."
    - k: "uncertainty"
      h: "La incertidumbre"
      p: "La cobertura se califica para cada estado y año. En esta versión {n_high} de {n_ty} estado-año alcanzan cobertura alta y {n_limited} son limitados: las proyecciones, las ediciones arrastradas y las fuentes documentales reducen la confianza, y 2027 es casi inobservable. Las texturas del mapa lo muestran directamente."
    - k: "explore"
      h: "Explora"
      p: "Vuelve al globo, cambia de capa, recorre los años y abre cualquier estado para ver exactamente qué valores, fuentes y supuestos producen su puntaje."
  method:
    - {h: "Pregunta de investigación", p: "¿Cómo se relaciona la expansión de la infraestructura digital con la demanda de energía, la presión hídrica y la gobernanza de los recursos en México? La pregunta es descriptiva y relacional; el diseño no presupone que la infraestructura cause presión."}
    - {h: "Unidad de análisis", p: "Una observación es una variable para un estado en un año (estado × año). Los registros de instalaciones existen solo en un registro documental y se agregan al estado antes de usarse; la identidad de los operadores no forma parte de los datos."}
    - {h: "Datos", p: "Datos abiertos oficiales de CONAGUA/SMN, CONAPO, CNE, INECC y CFE (en su mayoría CC BY 4.0 vía datos.gob.mx), límites de Natural Earth y un registro documental de regiones de nube construido con notas de proveedores y prensa especializada. Cada fuente se lista con su licencia y condición de redistribución."}
    - {h: "Variables", p: "Ocho indicadores entran al índice (dos de agua, dos de energía, uno digital, tres territoriales); nueve más son variables de contexto o gobernanza que nunca entran. Definiciones, unidades y direcciones están en el diccionario de datos."}
    - {h: "Normalización", p: "Los indicadores se orientan para que más alto signifique más presión, se transforman con logaritmo cuando son muy asimétricos, se winsorizan en los percentiles 2 y 98 (salvo conteos con exceso de ceros) y se escalan min–max sobre la distribución agrupada 2020–2025, de modo que un cambio entre años es un cambio en las condiciones y no un reescalamiento."}
    - {h: "Índice", p: "Pilar = media de sus indicadores normalizados disponibles, calculada solo si existe al menos la mitad. SRTI = Σ wₚ · pilarₚ sobre W, E, D, V; se calcula solo con al menos tres pilares, con pesos renormalizados y la fila marcada."}
    - {h: "Ponderación", p: "Los pesos iguales (25% cada uno) son la línea base porque aún no existe una base empírica defendible para otros pesos. El Índice de Línea Base de Recursos excluye el pilar digital para leer la presión sobre los recursos sin suponer que la infraestructura forma parte de ella."}
    - {h: "Sensibilidad", p: "Pesos cargados a agua, energía, digital y vulnerabilidad, media geométrica, normalizaciones z y percentil, y 2,000 extracciones de pesos Dirichlet(α = 4). Los resultados se reportan como intervalos de lugar y correlaciones de Spearman con la línea base."}
    - {h: "Incertidumbre", p: "Cobertura = media por pilar de los pesos de indicador (peso por estatus × antigüedad × año parcial × edición sin fecha). Niveles: alta ≥ 0.75, moderada ≥ 0.5, limitada ≥ 0.25; si no, insuficiente, y entonces no se muestra el compuesto."}
    - {h: "Datos faltantes", p: "Un faltante nunca es cero. Existen todas las filas esperadas estado-año-variable; los valores ausentes se marcan como desconocidos con un motivo. Las ediciones se arrastran solo hacia adelante y con penalización de cobertura."}
    - {h: "Resolución geográfica", p: "Estados (32). Sequía y vulnerabilidad se agregan desde municipios con pesos municipales iguales; los acuíferos se asignan a estados como los publica CONAGUA. Los límites son polígonos generalizados de Natural Earth; el Marco Geoestadístico del INEGI es la referencia para próximas versiones."}
    - {h: "Resolución temporal", p: "Anual, 2020–2027. 2026 combina observaciones de año parcial; 2027 solo contiene proyecciones y valores arrastrados, y así se marca."}
    - {h: "Metodología jurídica", p: "La capa de gobernanza registra instrumentos, fechas, competencias y categorías neutrales (marco aplicable, restricción regulatoria, competencia institucional, prioridad de política, asignación de recursos, pregunta jurídica, datos insuficientes, requiere análisis jurídico). Nunca califica algo de ilegal o inconstitucional."}
    - {h: "Reproducibilidad", p: "Ejecutar `python -m src.run_pipeline` reconstruye cada número a partir de archivos crudos cuyas sumas de verificación están en data/raw/MANIFEST.csv. Los parámetros viven en config/; las pruebas cubren las reglas anteriores."}
