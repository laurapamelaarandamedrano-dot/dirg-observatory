  story:
    - k: "question"
      h: "The question"
      p: "Digital infrastructure in Mexico is expanding. Between 2019 and 2025 the number of hyperscale cloud regions reported in the country went from {regions_2019} to {regions_2025}. The observatory asks how that expansion relates to energy systems, water pressure and the way resources are governed, without assuming the answer."
    - k: "territory"
      h: "The territory"
      p: "Infrastructure is territorial. Every documented region sits in one of {region_states} states, and {top_share} of them in {top_state}. The chart counts regions reported operational at the end of each year. Announced projects are tracked separately and never counted as built."
    - k: "resources"
      h: "The resources"
      p: "Data centres draw on electricity systems and, depending on their cooling, on water. Two of the series the observatory uses are shown below: national final electricity consumption (CFE) and the average drought intensity of the 32 states (SMN). Consumption is only published nationally in open form, so it cannot be mapped by state."
    - k: "governance"
      h: "The governance"
      p: "Water and energy are allocated through institutions: concessions, permits, groundwater ordinances and planning law. Mexico rewrote its electricity laws in March 2025 and its water laws in December 2025. In {ord_year}, every state had at least {min_ord}% of its area under some CONAGUA groundwater ordinance (veda, regulation or suspension agreement). The observatory maps these instruments descriptively. It does not score legality, and open legal questions are kept as questions."
    - k: "data"
      h: "The data"
      p: "Each value carries its epistemic status. Of the {n_index} indicators that feed the index, {n_direct} are recorded directly by an official or documentary source, the rest are derived, estimated or modelled. Facility-level water and energy use of data centres is not publicly reported in Mexico, so it is not in the dataset."
    - k: "model"
      h: "The model"
      p: "The Sociotechnical Resource Tension Index averages four pillars (water, energy, digital infrastructure, territorial vulnerability) on pooled 0–100 scales. Equal weights are a transparent baseline, not a finding. Eight alternative specifications and 2,000 random weightings test how much the ranking depends on that choice."
    - k: "uncertainty"
      h: "The uncertainty"
      p: "Coverage is scored for every state and year. In this release {n_high} of {n_ty} territory-years reach high coverage and {n_limited} are limited: projections, carried-forward vintages and documentary sources lower confidence, and 2027 is mostly unobservable. Textures on the map show this directly."
    - k: "explore"
      h: "Explore"
      p: "Return to the globe, switch layers, move through the years and open any state to see exactly which values, sources and assumptions produce its score."
  method:
    - {h: "Research question", p: "How does the expansion of digital infrastructure relate to energy demand, water pressure and resource governance in Mexico? The question is descriptive and relational; the design does not presuppose that infrastructure causes pressure."}
    - {h: "Unit of analysis", p: "One observation is one variable for one state in one year (state × year). Facility records exist only in a documentary register and are aggregated to the state before use; operator identities are not part of the data."}
    - {h: "Data", p: "Official open data from CONAGUA/SMN, CONAPO, CNE, INECC and CFE (mostly CC BY 4.0 through datos.gob.mx), Natural Earth boundaries, and a documentary register of cloud regions built from provider notes and trade press. Every source is listed with its license and redistribution status."}
    - {h: "Variables", p: "Eight indicators enter the index (two water, two energy, one digital, three territorial); nine more are context or governance variables that never enter it. Definitions, units and directions are in the data dictionary."}
    - {h: "Normalization", p: "Indicators are oriented so that higher means more pressure, log-transformed when strongly skewed, winsorized at the 2nd and 98th percentiles (except zero-inflated counts) and min–max scaled over the pooled 2020–2025 distribution, so a change between years is a change in conditions, not a rescaling."}
    - {h: "Index", p: "Pillar = mean of its available normalized indicators, computed only when at least half of them exist. SRTI = Σ wₚ · pillarₚ over W, E, D, V; computed only with at least three pillars, with weights renormalized and the row flagged."}
    - {h: "Weighting", p: "Equal weights (25% each) are the baseline because no defensible empirical basis for other weights exists yet. The Resource Baseline Index drops the digital pillar so that resource pressure can be read without assuming infrastructure is part of it."}
    - {h: "Sensitivity", p: "Water-, energy-, digital- and vulnerability-heavy weights, a geometric mean, z-score and percentile normalizations, and 2,000 Dirichlet(α = 4) weight draws. Results are reported as rank intervals and Spearman correlations with the baseline."}
    - {h: "Uncertainty", p: "Coverage = mean across pillars of indicator weights (status weight × recency × partial-year × undated-vintage factors). Tiers: high ≥ 0.75, moderate ≥ 0.5, limited ≥ 0.25, otherwise insufficient, in which case no composite is shown."}
    - {h: "Missing data", p: "Missing is never zero. Every expected state-year-variable row exists; absent values are marked unknown with a reason. Vintages are carried forward only forward in time and with a coverage penalty."}
    - {h: "Geographic resolution", p: "States (32). Drought and vulnerability are aggregated from municipalities with equal municipal weights; aquifers are assigned to states as published by CONAGUA. Boundaries are generalized Natural Earth polygons; INEGI's Marco Geoestadístico is the reference for future releases."}
    - {h: "Temporal resolution", p: "Annual, 2020–2027. 2026 combines partial-year observations; 2027 contains only projections and carried-forward values and is flagged as such."}
    - {h: "Legal methodology", p: "The governance layer records instruments, dates, competences and neutral categories (applicable framework, regulatory constraint, institutional competence, policy priority, resource allocation, legal question, data insufficient, requires legal analysis). It never labels anything illegal or unconstitutional."}
    - {h: "Reproducibility", p: "Running `python -m src.run_pipeline` rebuilds every number from raw files whose checksums are recorded in data/raw/MANIFEST.csv. Parameters live in config/; tests cover the rules above."}
