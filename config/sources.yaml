# Source registry. Single source of truth for provenance.
# Every dataset enters this file BEFORE any of its data enters the pipeline.
# `redistribution`:
#   raw_ok        -> raw file may be redistributed (still kept out of git; fetched by manifest)
#   derived_only  -> only aggregated/derived values are published
#   metadata_only -> only citation + transformation notes are published
# `fetch.url` is the official endpoint used by `src/ingest.py`.
# `access_date` is when the bytes in data/raw were obtained for this release.

registry_version: "0.1.0"

sources:

  - id: S01
