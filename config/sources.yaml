    institution: "Servicio Meteorológico Nacional (SMN), Comisión Nacional del Agua (CONAGUA)"
    title: "Monitor de Sequía de México: municipios con sequía (archivo histórico municipal)"
    url_landing: "https://smn.conagua.gob.mx/es/climatologia/monitor-de-sequia/monitor-de-sequia-en-mexico"
