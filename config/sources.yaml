    access_date: "2026-10-04"
    license: "Public government information (gob.mx). Specific terms not stated on the file; treated as derived_only pending confirmation."
    dataset_type: administrative
    geographic_coverage: "Mexico, 2,4xx municipalities"
    temporal_coverage: "2003-01 to 2026-09-15 (monthly, biweekly since 2014)"
